  <line x1="48" y1="64" x2="68" y2="64" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round"></line>

  
  <text x="94" y="58" font-family="&#39;DM Sans&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif" font-size="26" font-weight="200" fill="#d8d8d8" letter-spacing="10">YRA</text>
</svg>