[build]
buildCommand = "npm install"

[deploy]
# Shared by every service deployed from this repo, and config-as-code owned
# (Railway locks the dashboard Custom Start Command field while it is set),
# so it cannot differ per service. workers/entry.ts dispatches on CRON_ROUTE
# instead: the five cron-* services fire their route and exit, everything
# else starts the worker fleet. See workers/cron-mode.ts.
startCommand = "npx tsx workers/entry.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
