[build]
  base    = "LYRA/lyra"
  command = "npx prisma generate && DIRECT_URL=\"$DATABASE_URL\" npx prisma db push --accept-data-loss && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Prevent Netlify's CDN from caching any authenticated dashboard routes.
# These headers are applied at the edge before caching decisions are made,
# unlike Next.js response headers which arrive too late to stop a CDN cache hit.
[[headers]]
  for = "/workspace/*"
  [headers.values]
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"

[[headers]]
  for = "/agency/*"
  [headers.values]
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"

[[headers]]
  for = "/account/*"
  [headers.values]
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
