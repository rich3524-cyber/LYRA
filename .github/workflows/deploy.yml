name: Deploy LYRA

on:
  push:
    branches: [main]
    paths:
      - 'LYRA/lyra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LYRA/lyra/**'
      - '.github/workflows/deploy.yml'

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LYRA/lyra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LYRA/lyra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        # Non-blocking for now: 762 pre-existing lint errors across the codebase,
        # unrelated to any current work, went undetected because tsc always failed
        # first (see the working-directory fix above) so this step never ran.
        # Remove continue-on-error once the backlog is paid down.
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LYRA/lyra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LYRA/lyra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LYRA/lyra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LYRA/lyra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
        env:
          # Provide placeholder env vars so the build completes without real secrets
          DATABASE_URL:              postgresql://placeholder/lyra
          DIRECT_URL:                postgresql://placeholder/lyra
          REDIS_URL:                 redis://localhost:6379
          AUTH0_SECRET:              placeholder-secret-32-chars-minimum
          AUTH0_DOMAIN:              placeholder.auth0.com
          AUTH0_CLIENT_ID:           placeholder
          AUTH0_CLIENT_SECRET:       placeholder
          APP_BASE_URL:              https://placeholder.lyraonline.ai
          ANTHROPIC_API_KEY:         sk-ant-placeholder
          STRIPE_SECRET_KEY:         sk_test_placeholder
          STRIPE_WEBHOOK_SECRET:     whsec_placeholder
          STRIPE_STARTER_PRICE_ID:   price_placeholder
          STRIPE_PRO_PRICE_ID:       price_placeholder
          STRIPE_AGENCY_PRICE_ID:    price_placeholder
          S3_REGION:                 ap-southeast-2
          S3_ACCESS_KEY_ID:          placeholder
          S3_SECRET_ACCESS_KEY:      placeholder
          AWS_S3_BUCKET:             placeholder

  # Netlify deploys automatically via its GitHub integration (connected in Netlify dashboard).
  # No deploy step needed here — Netlify triggers on push to main with its own build servers.
  #
  # Railway also deploys the worker service automatically via its own GitHub integration
  # (confirmed 2 Aug 2026: a push-triggered Railway deployment completed ~3 minutes before
  # a `railway up` step here would even have started). A `deploy-workers` job using the
  # Railway CLI used to exist here as a second, redundant deploy path -- it consistently
  # failed fast (~11s, too fast to be a real build attempt) because Railway was already
  # deploying via its native integration, and once `continue-on-error` was removed from it
  # (to stop failures being silently swallowed), those redundant failures started emailing
  # as if the real deploy had broken, when it hadn't. Removed rather than fixed, since
  # Railway's native integration already does the job.
