name: Secret Scan

# Runs on every PR, independent of the deploy.yml build pipeline: unlike that
# workflow, this isn't scoped to LYRA/lyra/** — a leaked credential can land
# in any tracked file (docs, root configs, etc.), so it needs to scan the
# whole repo on every pull request rather than gating on path filters.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks-action can diff base...head

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately no GITLEAKS_LICENSE secret here. gitleaks-action
          # only requires a (free) license key for repos owned by a GitHub
          # organization account; this repo is under a personal account, so
          # it runs in open-source CLI mode without one. If this repo is
          # ever transferred to an org, gitleaks-action will start failing
          # with a "no license" error until GITLEAKS_LICENSE is added.
          # This step fails the check (not just a warning) whenever
          # gitleaks finds a real secret in the PR's commits.
