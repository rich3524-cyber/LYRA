version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/LYRA/lyra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into one PR instead of one-per-package
      # noise; majors always get their own PR since they need real review.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
